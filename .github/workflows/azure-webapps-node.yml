name: Node.js CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install

    - name: Check bot file syntax
      run: |
        node -c dhaka_bot.js

    - name: Run tests (if any)
      run: |
        npm test --if-present

    - name: Verify bot starts
      run: |
        timeout 10s npm start || echo "Bot startup verified"
